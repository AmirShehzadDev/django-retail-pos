name: "${COMPOSE_PROJECT_NAME:-pos_codex}"

services:
  web:
    image: "${POS_APP_IMAGE:-pos-codex}:${POS_APP_VERSION:-development}"
    build:
      context: .
      args:
        APP_VERSION: "${POS_APP_VERSION:-development}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POS_DB_HOST: db
      POS_DB_PORT: "5432"
      APP_LOG_DIR: /app/var/log
      DJANGO_STATIC_ROOT: /app/var/static
      POS_APP_VERSION: "${POS_APP_VERSION:-development}"
    ports:
      - "${POS_APP_BIND:-127.0.0.1}:${POS_APP_PORT:-8000}:8000"
    volumes:
      - ./var/log:/app/var/log
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:16.14-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POS_DB_NAME: ${POS_DB_NAME}
      POS_DB_USER: ${POS_DB_USER}
      POS_DB_PASSWORD: ${POS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POS_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POS_DB_USER} -d $${POS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
