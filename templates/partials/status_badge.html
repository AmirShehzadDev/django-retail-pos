{% if active %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-800">
        <span class="size-1.5 rounded-full bg-emerald-600" aria-hidden="true"></span>Active
    </span>
{% else %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-700">
        <span class="size-1.5 rounded-full bg-slate-500" aria-hidden="true"></span>Inactive
    </span>
{% endif %}
