<div class="form-field">
    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-800">
        {{ field.label }}{% if field.field.required %}<span class="ml-1 text-red-700" aria-hidden="true">*</span><span class="sr-only"> (required)</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<div id="{{ field.id_for_label }}_help" class="mt-2 text-sm text-slate-600">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}
        <ul class="mt-2 space-y-1 text-sm font-medium text-red-700" id="{{ field.id_for_label }}_errors">
            {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    {% endif %}
</div>
